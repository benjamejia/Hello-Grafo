<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ruta de aprendizaje de las materias de programación de Ingeniería en Ciencias Computacionales (CUTonalá)."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%234f46e5%22/%3E%3Cg fill=%22none%22 stroke=%22white%22 stroke-width=%221.8%22%3E%3Ccircle cx=%227%22 cy=%228%22 r=%222%22/%3E%3Ccircle cx=%2217%22 cy=%228%22 r=%222%22/%3E%3Ccircle cx=%2212%22 cy=%2217%22 r=%222%22/%3E%3Cpath d=%22M9 8h6M8.2 9.8l2.8 5.4M15.8 9.8 13 15.2%22/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Ruta de programación · ICC CUTonalá</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("mapa-programacion-estructurada");
          var preference = raw ? JSON.parse(raw).state.themePreference : "system";
          var dark =
            preference === "dark" ||
            (preference !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          /* La preferencia se aplicará al montar React. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <p
        style="margin: 0; display: flex; height: 100dvh; align-items: center; justify-content: center; font: 600 15px system-ui, sans-serif; color: #475569"
      >
        Cargando tu ruta de programación…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
