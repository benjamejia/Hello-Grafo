# Revisa cada cambio antes de que llegue a main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Contenido, código y tamaño
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validar contenido (ids, prerrequisitos, ciclos, fichas)
        run: npm run validate

      - name: Detectar código y dependencias sin usar (knip)
        run: npm run check:unused

      - name: Revisar tipos y compilar
        run: npm run build

      - name: Presupuesto de tamaño
        run: npm run check:size

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  rendimiento:
    name: Lighthouse (rendimiento y accesibilidad)
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse
          retention-days: 14
